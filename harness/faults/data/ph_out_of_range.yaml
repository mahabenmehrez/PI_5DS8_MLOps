# 3% of pH values impossible (pH 9 in wine)
id: data.out_of_range.pH
layer: data
author: P3
target: {column: pH, rate: 0.03, value: 9.0}
start: {after_batches: 10}
duration: {batches: 1}
applies_to: [batch, requests]
inject: harness.faults.data:out_of_range
revert: harness.faults.data:restore_column
expected:
  owner: checker
  root_cause_node: "feature:pH"
  acceptable_actions: [repair, quarantine]
  must_not: [request.retrain]
