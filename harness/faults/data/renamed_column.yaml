# The upstream export renames a column
id: data.renamed_column.alcohol
layer: data
author: P3
target: {column: alcohol, new_name: alcohol_pct}
start: {after_batches: 10}
duration: {batches: 1}
applies_to: [batch]
inject: harness.faults.data:rename_column
revert: harness.faults.data:restore_column
expected:
  owner: checker
  root_cause_node: "feature:alcohol"
  acceptable_actions: [repair]
  must_not: [request.retrain]
