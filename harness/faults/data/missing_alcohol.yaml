# 10% of alcohol values missing: small enough to impute with the reference median
id: data.missing_values.alcohol
layer: data
author: P3
target: {column: alcohol, rate: 0.10}
start: {after_batches: 10}
duration: {batches: 1}
applies_to: [batch, requests]
inject: harness.faults.data:null_values
revert: harness.faults.data:restore_column
expected:
  owner: checker
  root_cause_node: "feature:alcohol"
  acceptable_actions: [repair, quarantine]
  must_not: [request.retrain]
